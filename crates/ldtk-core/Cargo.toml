[package]
name = "ldtk-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
libc = "0.2"
asefile = "0.3.8"
regex = "1"
regress = { version = "0.12", features = ["utf16"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
