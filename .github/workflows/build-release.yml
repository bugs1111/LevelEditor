name: Build and release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc -vV
      - name: macOS application
        id: bundle
        run: scripts/package-macos
      - name: Release package
        id: package
        if: "!cancelled() && steps.bundle.outcome == 'success'"
        run: |
          python scripts/package-release.py --target '${{ matrix.target }}'
          git rev-parse HEAD^ > dist/source-commit.txt
      - uses: actions/upload-artifact@v7
        if: "!cancelled() && steps.package.outcome == 'success'"
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/ldtk-rs-v*.zip
            dist/target-*.json
            dist/source-commit.txt
          if-no-files-found: error
      - name: Verify Finder document opening
        timeout-minutes: 3
        run: scripts/verify-macos-bundle
      - name: Test workspace
        if: '!cancelled()'
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1
