name: Build and release
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified version to this repository's Releases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc -vV
      - name: Check, test and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo test --example native_smoke capture_tests --locked
          cargo build --release --bin ldtk-rs --locked
      - name: macOS application
        if: runner.os == 'macOS'
        run: scripts/package-macos
      - name: Release package
        run: python scripts/package-release.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/ldtk-rs-v*.zip
            dist/target-*.json
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify and publish native update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/package-release.py --merge release-assets
          version=$(python -c 'import json; print(json.load(open("release-assets/ldtk-rs-updates.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then exit 1; fi
          gh release create "v$version" release-assets/*.zip release-assets/ldtk-rs-updates.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LDtk Rust v$version" --generate-notes
