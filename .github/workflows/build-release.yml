name: Build and release
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notarize_macos:
        description: Verify Developer ID signing and Apple notarization on main
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc -vV
      - name: Check, test and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked --no-fail-fast
          cargo test --example native_smoke capture_tests --locked
          cargo build --release --bin level-editor --locked
      - name: macOS application
        if: runner.os == 'macOS'
        run: scripts/package-macos
      - name: Sign and notarize macOS application
        id: notarize_macos
        if: >-
          runner.os == 'macOS' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.notarize_macos))
        timeout-minutes: 35
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: scripts/notarize-macos 'dist/Level Editor.app'
      - name: Release package
        run: python scripts/package-release.py --target '${{ matrix.target }}'
      - name: Verify notarization survives release packaging
        if: steps.notarize_macos.outcome == 'success'
        run: |
          set -- dist/level-editor-v*-${{ matrix.target }}.zip
          test "$#" -eq 1
          verify_dir=$(mktemp -d "$RUNNER_TEMP/level-editor-verify.XXXXXX")
          trap 'rm -rf "$verify_dir"' EXIT
          ditto -x -k "$1" "$verify_dir"
          bundle="$verify_dir/Level Editor.app"
          codesign --verify --deep --strict "$bundle"
          syspolicy_check distribution "$bundle"
          LEVEL_EDITOR_TEST_NOTARIZED_BUNDLE="$bundle" cargo test --locked --bin level-editor \
            updater::installer::tests::notarized_release_helper_confirms_restart_handshake -- --ignored --exact
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/level-editor-v*.zip
            dist/target-*.json
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify and publish native update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/package-release.py --merge release-assets
          version=$(python -c 'import json; print(json.load(open("release-assets/level-editor-updates.json"))["version"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then exit 1; fi
          gh release create "v$version" release-assets/level-editor-v*.zip release-assets/level-editor-updates.json --repo "$GITHUB_REPOSITORY" --verify-tag --title "Level Editor v$version" --generate-notes
