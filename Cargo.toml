[package]
name = "level-editor"
version = "0.1.11"
edition = "2024"
license = "MIT"
description = "Level Editor, a native Rust port of the LDtk level editor"

[workspace]
members = ["crates/ldtk-core"]
exclude = ["vendor/winit", "vendor/block"]
resolver = "2"

[dependencies]
ldtk-core = { path = "crates/ldtk-core" }
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui_extras = { version = "=0.33.0", features = ["svg", "image", "file"] }
egui_commonmark = { version = "=0.22.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
semver = "1"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
wgpu = { version = "27", default-features = false, features = ["std", "metal", "wgsl"] }
winit = { version = "=0.30.13", default-features = false }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSLocale", "NSObject", "NSAppleEventManager", "NSAppleEventDescriptor", "NSURL", "NSString", "NSDate", "NSError", "NSRunLoop", "objc2-core-services"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "wgsl"] }
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"
wgpu = { version = "27", default-features = false, features = ["std", "vulkan", "wgsl"] }

[patch.crates-io]
# Winit 0.30.13 with the X11 wheel-release backport and macOS quit handling.
winit = { path = "vendor/winit" }
# Keep the Metal dependency's Apple Blocks ABI declaration valid on newer Rust.
block = { path = "vendor/block" }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "level-editor"
path = "src/main.rs"

[[test]]
name = "platform_files"
path = "tests/platform_files.rs"
harness = false
